<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Звонок</title>
    <!-- Telegram Web App SDK: provides window.Telegram.WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <!--
      Заглушка до запуска приложения. Нужна не для красоты: если окно звонка
      не запустится — не загрузился бандл, старый WebView не понял код, —
      Telegram покажет просто пустой экран, по которому нечего понять. Здесь
      человек увидит хотя бы адрес, по которому его открыли, и подсказку, где
      искать причину. React при монтировании заменяет содержимое #root, и
      заглушка исчезает сама.
    -->
    <div id="root">
      <div id="boot" style="min-height: 200px; padding: 16px; box-sizing: border-box;
        background: #0e1420; color: #8fa0bc; font-size: 13px; line-height: 1.6;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;">
        Загружаю звонок…
      </div>
    </div>
    <script>
      (function () {
        var first = "";
        window.addEventListener("error", function (e) {
          if (!first) first = String(e.message || "") + (e.filename ? " (" + e.filename + ")" : "");
        });
        setTimeout(function () {
          var b = document.getElementById("boot");
          if (!b) return;                     // приложение запустилось и заменило заглушку
          var here = location.origin + location.pathname;
          b.style.color = "#E6EDF7";
          b.innerHTML = "<b>Звонок не запустился.</b><br><br>Открыто по адресу:<br><code>"
            + here.replace(/[<>&]/g, "") + "</code>"
            + (/\/call\/?$/.test(location.pathname)
              ? ""
              : "<br><br>Адрес должен заканчиваться на <b>/call</b>. Если он другой —"
                + " в @BotFather у мини-приложения указан не тот адрес: /myapps →"
                + " приложение → Edit Web App URL.")
            + (first ? "<br><br>Ошибка: " + first.replace(/[<>&]/g, "") : "");
        }, 8000);
      })();
    </script>
    <script type="module" src="/src/call-main.jsx"></script>
  </body>
</html>
