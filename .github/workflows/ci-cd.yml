name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
  # Позволяет запустить деплой вручную из вкладки Actions — например, сразу
  # после того, как секреты добавлены, не делая для этого пустой коммит.
  workflow_dispatch:

permissions:
  contents: read

# Лишние прогоны на фича-ветках отменяем, но деплой main никогда не прерываем
# на середине (иначе можно оборвать rsync и оставить сервер в полусостоянии).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Тесты и сборка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            server/package-lock.json

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Install server deps
        working-directory: server
        run: npm ci

      - name: Test web (vitest)
        working-directory: web
        run: npm test

      - name: Test server (vitest)
        working-directory: server
        run: npm test

      - name: Build web
        working-directory: web
        run: npm run build

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

  deploy:
    name: Деплой на сервер
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      # Пока секреты не добавлены, деплой не падает с красным крестом,
      # а аккуратно пропускается и пишет в summary, чего не хватает.
      - name: Проверить, настроены ли секреты деплоя
        id: secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          missing=""
          for name in SSH_HOST SSH_USER SSH_PRIVATE_KEY DEPLOY_PATH TELEGRAM_BOT_TOKEN; do
            if [ -z "${!name:-}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Деплой пропущен — не настроены секреты"
              echo ""
              echo "Отсутствуют: **${missing# }**"
              echo ""
              echo "Добавить: Settings → Secrets and variables → Actions → New repository secret."
              echo "Пошаговая инструкция — в \`docs/DEPLOYMENT.md\`."
              echo "После добавления: Actions → CI/CD → Run workflow (ветка \`main\`)."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Секреты не настроены (${missing# }) — деплой пропущен, см. summary."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - name: Download web build artifact
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Assemble deploy package (server + собранный фронтенд)
        if: steps.secrets.outputs.ready == 'true'
        run: |
          set -euo pipefail
          rm -rf deploy_pkg
          mkdir -p deploy_pkg/public
          cp -r server/src deploy_pkg/src
          cp server/package.json server/package-lock.json server/ecosystem.config.cjs deploy_pkg/
          cp -r web/dist/. deploy_pkg/public/

      - name: Write production .env for the server
        if: steps.secrets.outputs.ready == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          umask 077
          cat > deploy_pkg/.env <<EOF
          NODE_ENV=production
          PORT=3000
          SCENARIOS_DIR=${DEPLOY_PATH}/data/scenarios
          TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
          EOF

      - name: Install SSH key
        if: steps.secrets.outputs.ready == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust server host key
        if: steps.secrets.outputs.ready == 'true'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      # Ловим отсутствие rsync/node/pm2 на сервере до того, как начнём что-то менять,
      # чтобы вместо невнятной ошибки транспорта была понятная подсказка.
      - name: Pre-flight проверка окружения сервера
        if: steps.secrets.outputs.ready == 'true'
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh -p "${SSH_PORT:-22}" "${SSH_USER}@${SSH_HOST}" \
            "DEPLOY_PATH=$(printf '%q' "$DEPLOY_PATH") bash -s" <<'REMOTE'
          set -u
          export PATH="$PATH:/usr/local/bin:/usr/bin"
          missing=""
          for c in rsync node npm pm2 curl; do
            command -v "$c" >/dev/null 2>&1 || missing="$missing $c"
          done
          if [ -n "$missing" ]; then
            echo "ОШИБКА: на сервере не хватает команд:$missing" >&2
            echo "Установите их — см. docs/DEPLOYMENT.md, шаг 3." >&2
            exit 1
          fi
          mkdir -p "$DEPLOY_PATH/app" "$DEPLOY_PATH/data/scenarios"
          if [ ! -w "$DEPLOY_PATH" ]; then
            echo "ОШИБКА: нет прав на запись в $DEPLOY_PATH (проверьте chown из шага 3.3)" >&2
            exit 1
          fi
          echo "Сервер готов: node $(node -v), npm $(npm -v), pm2 есть, $DEPLOY_PATH доступен на запись."
          REMOTE

      - name: Rsync app to server (данные сценариев не трогаются — они вне app/)
        if: steps.secrets.outputs.ready == 'true'
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          rsync -az --delete \
            -e "ssh -p ${SSH_PORT:-22}" \
            deploy_pkg/ "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/app/"

      - name: Install prod deps, restart via PM2, health-check
        if: steps.secrets.outputs.ready == 'true'
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh -p "${SSH_PORT:-22}" "${SSH_USER}@${SSH_HOST}" \
            "DEPLOY_PATH=$(printf '%q' "$DEPLOY_PATH") bash -s" <<'REMOTE'
          set -euo pipefail
          export PATH="$PATH:/usr/local/bin:/usr/bin"

          cd "$DEPLOY_PATH/app"
          mkdir -p "$DEPLOY_PATH/data/scenarios"
          chmod 600 .env

          npm ci --omit=dev
          pm2 startOrReload ecosystem.config.cjs --update-env
          pm2 save

          # Убеждаемся, что процесс реально поднялся, а не упал сразу после старта.
          for _ in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1; then
              echo "Деплой успешен: /api/health отвечает."
              exit 0
            fi
            sleep 2
          done
          echo "ОШИБКА: /api/health не ответил в течение 30 секунд после перезапуска." >&2
          pm2 logs system-dynamics-ui --lines 50 --nostream || true
          exit 1
          REMOTE

      - name: Итог, если деплой пропущен
        if: steps.secrets.outputs.ready != 'true'
        run: |
          echo "Код собран и протестирован, но деплой пропущен: не заданы секреты."
          echo "Инструкция: docs/DEPLOYMENT.md"
