name: Deploy to GitHub Pages

# Вариант деплоя без сервера: статика едет на GitHub Pages, сценарии
# сохраняются в облако Telegram (web/src/storage.js). Ни секретов, ни SSH.
#
# Для приватного репозитория Pages доступен только на платном плане GitHub.
# Поэтому шаг включения Pages помечен continue-on-error: если план не
# позволяет, прогон останется зелёным и просто напишет об этом в summary,
# а не будет светить красным крестом на каждый push.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Сборка и публикация на Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install deps
        working-directory: web
        run: npm ci

      - name: Test
        working-directory: web
        run: npm test

      # enablement: true включает Pages через API, если он ещё не включён.
      - name: Configure Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build
        if: steps.pages.outcome == 'success'
        working-directory: web
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      # Pages не отдаёт index.html на вложенные пути — копия под именем
      # 404.html делает переходы внутри приложения безопасными.
      - name: SPA fallback
        if: steps.pages.outcome == 'success'
        run: cp web/dist/index.html web/dist/404.html

      - name: Upload artifact
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - name: Deploy
        id: deployment
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4

      - name: Ссылка на опубликованное приложение
        if: steps.pages.outcome == 'success'
        run: |
          {
            echo "### Приложение опубликовано"
            echo ""
            echo "URL: ${{ steps.deployment.outputs.page_url }}"
            echo ""
            echo "Этот адрес нужно указать в @BotFather: /mybots → бот →"
            echo "Bot Settings → Menu Button → Edit menu button URL."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Pages недоступен
        if: steps.pages.outcome != 'success'
        run: |
          {
            echo "### GitHub Pages недоступен для этого репозитория"
            echo ""
            echo "Репозиторий приватный, а Pages для приватных репозиториев"
            echo "работает только на платном плане GitHub."
            echo ""
            echo "Варианты: сделать репозиторий публичным, либо развернуть"
            echo "на свой сервер — см. \`docs/DEPLOYMENT.md\`."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Pages недоступен — публикация пропущена (прогон намеренно оставлен зелёным)."
